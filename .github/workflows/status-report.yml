# Scheduled observability: rebuild the remediation status report from Devin and
# publish it to the run's Job Summary (and as a downloadable artifact) -- no local
# `poll` and no commit back to the repo. It derives state from the Devin session
# list (sessions titled "Remediate #<n>: ...") rather than any committed state, so
# the latest run's Summary always shows the current picture.
#
# View it: Actions tab -> "Remediation status report" -> open the latest run ->
# the report is rendered in the run Summary.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEVIN_API_KEY  -- the cog_* service-user token
#   DEVIN_ORG_ID   -- the org-* organization id
name: Remediation status report

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the bot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.19"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Rebuild the report from Devin sessions
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
        run: uv run python main.py sync

      - name: Publish the report to the run summary
        # Still surface a summary if the sync step failed before writing the report.
        if: ${{ !cancelled() }}
        run: |
          if [ -f data/report.md ]; then
            cat data/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Remediation status report unavailable"
              echo
              echo "\`uv run python main.py sync\` failed before generating data/report.md; see the job logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report and task state
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remediation-status
          path: data/
          if-no-files-found: ignore
